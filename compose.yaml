services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pool
      POSTGRES_USER: pool
      POSTGRES_PASSWORD: pool
    volumes:
      - pool-db:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pool -d pool"]
      interval: 3s
      timeout: 3s
      retries: 20

  game:
    build:
      context: .
      dockerfile: game-server/Dockerfile
    environment:
      APP_ENV: development
      PORT: 8081
      DATABASE_URL: postgres://pool:pool@db:5432/pool?sslmode=disable
      JOIN_TOKEN_SECRET: local-development-join-token-secret-please-change
      GAME_INTERNAL_SECRET: local-development-internal-secret-change
      ALLOWED_ORIGINS: http://localhost:8080
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    environment:
      APP_ENV: development
      APP_BASE_URL: http://localhost:8080
      GAME_PUBLIC_WS_URL: ws://localhost:8081/ws
      GAME_INTERNAL_URL: http://game:8081
      DATABASE_URL: postgres://pool:pool@db:5432/pool?sslmode=disable
      JOIN_TOKEN_SECRET: local-development-join-token-secret-please-change
      GAME_INTERNAL_SECRET: local-development-internal-secret-change
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy
      game:
        condition: service_started

volumes:
  pool-db:
