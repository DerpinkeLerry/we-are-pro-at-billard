ProxyPreserveHost On
ProxyRequests Off

# Browser traffic uses the same public origin. Apache forwards only the real-time
# endpoints to the Go process that is listening inside this container.
ProxyPass        "/ws"   "ws://127.0.0.1:8081/ws" retry=0 timeout=75
ProxyPassReverse "/ws"   "ws://127.0.0.1:8081/ws"
ProxyPass        "/ping" "http://127.0.0.1:8081/ping" retry=0 timeout=5
ProxyPassReverse "/ping" "http://127.0.0.1:8081/ping"
